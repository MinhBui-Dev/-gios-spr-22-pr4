syntax = "proto3";

package dfs_service;

import "google/protobuf/timestamp.proto";


service DFSService {

    // Add your service calls here

    // 1. REQUIRED (Parts 1 & 2): A method to store files on the server
    rpc storeFile (stream fileData) returns (fileDetail);
    // 2. REQUIRED (Parts 1 & 2): A method to fetch files from the server
    rpc fetchFile (file) returns (stream fileData);
    // 3. REQUIRED (Parts 1 & 2): A method to delete files from the server
    rpc deleteFile (file) returns (fileDetail);
    // 4. REQUIRED (Parts 1 & 2): A method to list all files on the server
    rpc listFile (Empty) returns (fileList);
    // 5. REQUIRED (Parts 1 & 2): A method to get the status of a file on the server
    rpc getStatus (file) returns (fileAttr);
    // 7. Any other methods you deem necessary to complete the tasks of this assignment



}

// Add your message types here

message fileData{
    string fileName = 1;
    bytes data = 2;
}

message file{
    string fileName = 1;
}

message Empty{
    string message = 1;
}

message fileDetail{
    string fileName =1;
    google.protobuf.Timestamp timeModified = 2;
}

message fileList{
    repeated fileDetail file = 1;
}

message fileAttr{
    string fileName = 1;
    uint64 fileSize = 2;
    google.protobuf.Timestamp timeModified = 3;
    google.protobuf.Timestamp timeCreated = 4;
}